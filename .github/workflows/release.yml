name: Release extension repository

# Tag vX.Y.Z -> build one zip per platform + index.json and attach them all to the GitHub Release.
# Nothing is deployed to GitHub Pages (that site belongs to docs.yml).
# Blender repository URL: https://github.com/<owner>/<repo>/releases/latest/download/index.json
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync
      - run: uv run ruff check .
      - run: uv run pytest -q

  release:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Install Blender
        shell: pwsh
        run: |
          choco install blender --version=5.0.1 -y --no-progress
          "BLENDER=C:\Program Files\Blender Foundation\Blender 5.0\blender.exe" | Out-File -Append $env:GITHUB_ENV
      - name: Build static repository
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME:-dev}"
          uv run python scripts/make_repo.py --base-url "https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}"
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            repo/*.zip
            repo/index.json
      - name: Keep the build as a workflow artifact (manual runs without a tag)
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v4
        with:
          name: extension-repo
          path: |
            repo/*.zip
            repo/index.json
