name: Release extension repository

# Tag vX.Y.Z -> build zip, attach it to a GitHub Release, publish index.json/index.html on GitHub Pages.
# Blender repository URL afterwards: https://<owner>.github.io/<repo>/index.json
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync
      - run: uv run ruff check .
      - run: uv run pytest -q

  release:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Install Blender
        shell: pwsh
        run: |
          choco install blender --version=5.0.1 -y --no-progress
          "BLENDER=C:\Program Files\Blender Foundation\Blender 5.0\blender.exe" | Out-File -Append $env:GITHUB_ENV
      - name: Build static repository
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME:-dev}"
          uv run python scripts/make_repo.py --base-url "https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}"
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: repo/*.zip
      - name: Keep only the listing for Pages (the zip lives on the Release)
        shell: bash
        run: rm repo/*.zip
      - uses: actions/upload-artifact@v4
        with:
          name: repo-listing
          path: repo
          if-no-files-found: error

  # Pages needs the artifact built on Linux (upload-pages-artifact is unreliable on Windows runners),
  # so the Windows job hands the listing over as a plain artifact.
  pages:
    needs: release
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: repo-listing
          path: repo
      - uses: actions/upload-pages-artifact@v4
        with:
          path: repo
      - uses: actions/deploy-pages@v4
        id: deployment
