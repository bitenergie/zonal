name: Documentation
on:
  push:
    branches:
      - master
      - main
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/configure-pages@v6
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v6
      - run: uv python install 3.13
      # docs group only: zensical + mkdocstrings + autoapi (griffe is static, bpy/openstudio are not needed)
      - run: uv sync --only-group docs --no-install-project --python 3.13 --frozen
      - run: uv run --no-sync zensical build --clean
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site
  # Separate job: deploy-pages looks the artifact up right after upload, and in the same job it can miss it
  # ("No artifacts named github-pages"). https://github.com/actions/deploy-pages/issues/418
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v5
        id: deployment
